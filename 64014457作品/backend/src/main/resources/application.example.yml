server:
  port: 8081
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: edu-agent-backend

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/eduagent_v2?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
    username: root
    password: 123456
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20

  sql:
    init:
      mode: never
      schema-locations: classpath:schema.sql

  http:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  neo4j:
    uri: bolt://localhost:7687
    authentication:
      username: neo4j
      password: password123

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# JWT config
jwt:
  secret: edu_agent_jwt_secret_key_2024_smart_learning_system
  expiration: 86400000

logging:
  level:
    com.eduagent: DEBUG
    com.baomidou.mybatisplus: DEBUG
    org.apache.ibatis: DEBUG


knowledge:
  base:
    path: data/knowledge_base.json

serpapi:
  key: ${SERPAPI_KEY:}

ai:
  api-key: ${AI_API_KEY:your-api-key}
  endpoint: https://api.deepseek.com/chat/completions
  model: deepseek-v4-pro